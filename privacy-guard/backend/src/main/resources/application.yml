spring:
  application:
    name: privacy-guard

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:privacyguard}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: on_param

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-change-in-production-please}
    expiration-ms: 86400000  # 24 hours

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

  scan:
    max-concurrent: 10
    timeout-seconds: 30
    rate-limit-per-hour: 20    # per IP
    max-url-length: 2048

  report:
    storage-path: ${REPORT_PATH:/tmp/privacyguard/reports}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.privacyguard: INFO
    org.springframework.security: WARN
